<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile | SkillBridge</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<header>

    <div class="logo">
        Skill<span>Bridge</span>
    </div>

    <nav>

        <a href="/dashboard">
            Dashboard
        </a>

        <a href="/resume">
            Resume
        </a>

        <a href="/saved-jobs">
            ⭐ Saved Jobs
        </a>

        <a href="/logout">
            Logout
        </a>

    </nav>

</header>


<main class="container dashboard">

    <div class="badge">
        👤 MY PROFILE
    </div>

    <h1>
        Your Profile
    </h1>

    <p style="color:#cbd5e1; font-size:18px;">
        Keep your information updated for your learning
        and career journey.
    </p>


    <div class="card" style="margin-top:30px;">

        <form method="POST" action="/profile">


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ user['name'] or '' }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    value="{{ user['email'] }}"
                    disabled
                >

            </div>


            <div class="form-group">

                <label>
                    Phone
                </label>

                <input
                    type="text"
                    name="phone"
                    value="{{ user['phone'] or '' }}"
                    placeholder="Your phone number"
                >

            </div>


            <div class="form-group">

                <label>
                    Location
                </label>

                <input
                    type="text"
                    name="location"
                    value="{{ user['location'] or '' }}"
                    placeholder="City, State"
                >

            </div>


            <div class="form-group">

                <label>
                    Education
                </label>

                <input
                    type="text"
                    name="education"
                    value="{{ user['education'] or '' }}"
                    placeholder="Example: BCA, B.Tech, Diploma"
                >

            </div>


            <div class="form-group">

                <label>
                    Skills
                </label>

                <textarea
                    name="skills"
                    placeholder="Example: Python, HTML, CSS, JavaScript"
                >{{ user['skills'] or '' }}</textarea>

            </div>


            <div class="form-group">

                <label>
                    About Me
                </label>

                <textarea
                    name="bio"
                    placeholder="Tell us briefly about yourself"
                >{{ user['bio'] or '' }}</textarea>

            </div>


            <button
                type="submit"
                class="btn full-btn">

                💾 Save Profile

            </button>


        </form>

    </div>


</main>


<footer>

    <p>
        © 2026 SkillBridge
    </p>

    <p>
        Learn • Build • Apply • Grow
    </p>

</footer>


</body>

</html>
