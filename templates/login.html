<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | SkillBridge</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<header>

    <div class="logo">
        Skill<span>Bridge</span>
    </div>

    <nav>

        <a href="/">Home</a>

        <a href="/register">
            Register
        </a>

    </nav>

</header>


<main class="container">

    <div class="card form-box">

        <div class="badge">
            WELCOME BACK
        </div>

        <h1>Login</h1>

        <p style="color:#cbd5e1; margin-bottom:30px;">
            Login to continue your SkillBridge journey.
        </p>


        <form method="POST" action="/login">

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn full-btn">

                Login

            </button>

        </form>


        <p style="text-align:center; margin-top:25px; color:#cbd5e1;">

            Don't have an account?

            <a href="/register"
               style="color:#a78bfa;">

                Create Account

            </a>

        </p>

    </div>

</main>


<footer>

    <p>© 2026 SkillBridge</p>

</footer>

</body>

</html>
